<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">El Algoritmo: de visión a ejecución</title>
<desc id="desc">Tres etapas conectadas: diagnosticar, dominar y diseñar.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08080b"/><stop offset=".5" stop-color="#101827"/><stop offset="1" stop-color="#250b2f"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#facc15"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/>
<text x="600" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="900" text-anchor="middle">EL ALGORITMO</text>
<text x="600" y="132" fill="#9ca3af" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">DE LA VISIÓN A LA EJECUCIÓN</text>
<path d="M220 350H980" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g><circle cx="220" cy="350" r="108" fill="#111827" stroke="#facc15" stroke-width="5"/><text x="220" y="340" fill="#facc15" font-size="32" font-weight="900">01</text><text x="220" y="382" fill="#fff" font-size="22" font-weight="800">DIAGNOSTICAR</text></g>
<g><circle cx="600" cy="350" r="108" fill="#111827" stroke="#a78bfa" stroke-width="5"/><text x="600" y="340" fill="#a78bfa" font-size="32" font-weight="900">02</text><text x="600" y="382" fill="#fff" font-size="22" font-weight="800">DOMINAR</text></g>
<g><circle cx="980" cy="350" r="108" fill="#111827" stroke="#f472b6" stroke-width="5"/><text x="980" y="340" fill="#f472b6" font-size="32" font-weight="900">03</text><text x="980" y="382" fill="#fff" font-size="22" font-weight="800">DISEÑAR</text></g>
</g>
<g fill="#9ca3af" font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><text x="220" y="515">Descubre el patrón</text><text x="600" y="515">Instala el hack</text><text x="980" y="515">Actúa con precisión</text></g>
</svg>