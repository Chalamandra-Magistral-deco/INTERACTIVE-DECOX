  <script>
    (function () {
      window.dataLayer = window.dataLayer || [];
      var hostname = window.location.hostname;
      var parts = hostname.split(".");
      var sourceSubdomain = parts.length > 2 ? parts[0] : hostname;
      var nav = document.getElementById("decox-nav");

      if (nav) {
        nav.addEventListener("click", function (event) {
          var link = event.target.closest("a");
          if (!link) return;
          var destination = "internal";
          try {
            var targetUrl = new URL(link.href, window.location.href);
            var targetParts = targetUrl.hostname.split(".");
            destination = targetUrl.hostname === window.location.hostname
              ? "internal"
              : (targetParts.length > 2 ? targetParts[0] : targetUrl.hostname);
          } catch (error) {
            destination = "unknown";
          }

          window.dataLayer.push({
            event: link.classList.contains("decox-primary") ? "corporate_lead_click" : "nav_click",
            source_subdomain: sourceSubdomain,
            destination_subdomain: destination,
            link_url: link.href,
            link_text: link.textContent.trim(),
            placement: "global_navigation"
          });
        });
      }

      window.trackModuleEngagement = function (moduleName, actionType, extra) {
        var eventData = {
          event: "module_engagement",
          module_name: moduleName,
          action_type: actionType,
